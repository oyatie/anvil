name: nightly

# The whole tree, nightly, against no diff.
#
# Presubmit is diff-scoped by construction: it judges what a change touched. A
# file nobody touches is therefore never judged, and drift in it is invisible
# until someone edits it. This rung exists to ask the questions that have no
# subject in a diff.

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-tree:
    name: whole-tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: "nightly-2026-09-10"
          components: rustfmt, clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: anvil-nightly
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # The audited macro surface is established by hashing the unpacked crate
      # sources under CARGO_HOME/registry/src against pinned fingerprints. The
      # Rust cache prunes that directory, and a warm target/ means no build
      # unpacks it again -- so the surface is revoked, every #[derive(Serialize)]
      # in the tree becomes unmeasurable, and the error names a source file
      # rather than the missing cache. This job is where that was measured: red
      # here while postsubmit was green on the same commit.
      #
      # The presubmit test job carries the same step for the same reason, and
      # is where this was measured: 67 failures without it, 0 with it, on one
      # tree. windows-capture runs it for a related reason -- offline metadata
      # on a machine with no cache at all.
      - name: Restore the complete locked source cache the macro surface needs
        run: cargo fetch --locked
      - name: Suite over the merged tree
        run: cargo nextest run --all-targets --no-fail-fast
      - name: Clippy over the merged tree
        run: cargo clippy --all-targets -- -D warnings
