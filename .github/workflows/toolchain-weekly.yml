name: toolchain-weekly

# Is the pinned channel still current, and is the MSRV still honest?
#
# Two facts a single "Rust version" reading conflates. The channel is what this
# repository compiles with; the MSRV is the oldest release it promises to
# compile on. They move in opposite directions, and a gate reading one as the
# other is wrong twice.
#
# Weekly because upstream releases on a six-week train and neither question has
# a subject in any diff.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# The channel job's pushes and pull-request creation use the explicitly
# attenuated App token. The ambient Actions token starts with no authority;
# nightly grants it read access only for checkout below.
permissions: {}

jobs:
  channel:
    name: channel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: toolchain-channel
      cancel-in-progress: false
    steps:
      # With no owner input, the action scopes the installation token to this
      # repository. Missing credentials fail this job; there is no Actions-token
      # or human-token fallback.
      - name: Mint repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.ANVIL_APP_ID }}
          private-key: ${{ secrets.ANVIL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Discovered, never hardcoded. A pin that names the answer cannot notice
      # the answer changing, which is the whole failure this lane exists for --
      # and this lane HAD that failure: it read `rustc --version` inside the
      # repository, where rustup resolves the toolchain through
      # rust-toolchain.toml, so it compared the pin against itself and reported
      # `behind=no` forever. Measured on 2026-09-10: it printed "latest stable
      # : 1.98.0" while stable had been 1.98.1 since 2026-09-03.
      #
      # The manifest is the authority no local file can override.
      - name: Compare the pin against what the channel publishes
        id: compare
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)
          edition=$(sed -n 's/^edition *= *"\(.*\)".*/\1/p' Cargo.toml)
          [ -n "$channel" ]
          [ "${edition}" = "2024" ] || { echo "edition must be 2024"; exit 1; }
          # This repository pins a dated nightly; a release pin is a different
          # decision and is not something this chore may make on its own.
          case "$channel" in
            nightly-*) ;;
            *) echo "the pin ${channel} is not a dated nightly; this lane does not move between channel kinds" >&2; exit 1 ;;
          esac
          latest=nightly-$(curl -sSf --retry 3 https://static.rust-lang.org/dist/channel-rust-nightly.toml | sed -n 's/^date = "\(.*\)"/\1/p' | head -1)
          [ "$latest" != "nightly-" ]
          echo "pinned channel : ${channel}"
          echo "latest nightly : ${latest}"
          echo "edition        : ${edition}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          if [ "${channel}" = "${latest}" ]; then
            echo "behind=no" >> "$GITHUB_OUTPUT"
          else
            echo "behind=yes" >> "$GITHUB_OUTPUT"
          fi

      # New bumps use the existing probe/apply owner. An existing exact proposal
      # can be recovered without claiming a probe in this run. Both require
      # ordinary presubmit/review and never push to the trunk.
      - name: Open the bump
        if: steps.compare.outputs.behind == 'yes'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LATEST: ${{ steps.compare.outputs.latest }}
          CHANNEL: ${{ steps.compare.outputs.channel }}
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          command -v jq >/dev/null
          [ "$GITHUB_SERVER_URL" = https://github.com ]
          origin_url=$(git remote get-url origin)
          case "$origin_url" in
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"|"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git") ;;
            *) echo "Unsupported checkout repository" >&2; exit 1 ;;
          esac
          [[ "$LATEST" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$CHANNEL" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          branch="chore/toolchain-${LATEST}"
          source_sha=$(git rev-parse HEAD)
          local_commit=""
          scratch=$(mktemp -d)
          trap 'rm -f "$scratch/base.json" "$scratch/prs.json" "$scratch/ref" "$scratch/before" "$scratch/after" "$scratch/base-entry" "$scratch/head-entry" "$scratch/changes" "$scratch/input.json" "$scratch/decision.json"; rmdir "$scratch"' EXIT

          # Reads only. The helper decides from complete JSON and immutable objects;
          # no branch name, failed API call or partial page is completion evidence.
          observe() {
            phase=$1
            gh api --hostname github.com "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" > "$scratch/base.json"
            gh api --hostname github.com --method GET --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=all -f "head=${GITHUB_REPOSITORY%%/*}:${branch}" -f per_page=100 > "$scratch/prs.json"
            remote_status=0
            git ls-remote --exit-code --heads origin "refs/heads/${branch}" > "$scratch/ref" || remote_status=$?
            case "$remote_status" in 0|2) ;; *) echo "Branch lookup failed" >&2; exit 1 ;; esac
            base_sha=$(jq -er '.object.sha | select(type == "string")' "$scratch/base.json")
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            head=""
            if [ "$phase" = prepared ]; then
              head=$local_commit
            elif [ "$remote_status" -eq 0 ]; then
              git fetch --no-tags --depth=2 origin "refs/heads/${branch}"
              head=$(git rev-parse --verify FETCH_HEAD)
            fi
            git show "${base_sha}:rust-toolchain.toml" > "$scratch/before"
            git ls-tree "$base_sha" -- rust-toolchain.toml > "$scratch/base-entry"
            parents=""
            : > "$scratch/after"
            : > "$scratch/head-entry"
            : > "$scratch/changes"
            if [ -n "$head" ]; then
              parents=$(git rev-list --parents -n 1 "$head")
              git show "${head}:rust-toolchain.toml" > "$scratch/after"
              git ls-tree "$head" -- rust-toolchain.toml > "$scratch/head-entry"
              git diff-tree --no-commit-id --name-status -r --no-renames "$base_sha" "$head" -- > "$scratch/changes"
            fi
            dirty=$(git status --porcelain)
            before_hex=$(od -An -v -tx1 "$scratch/before" | tr -d ' \n')
            after_hex=$(od -An -v -tx1 "$scratch/after" | tr -d ' \n')
            jq -n --arg phase "$phase" --arg repo "$GITHUB_REPOSITORY" \
              --arg latest "$LATEST" --arg channel "$CHANNEL" --arg checkout "$source_sha" \
              --arg dirty "$dirty" --slurpfile base "$scratch/base.json" \
              --slurpfile pages "$scratch/prs.json" --argjson remote_status "$remote_status" \
              --rawfile remote_ref "$scratch/ref" --arg fetched "$head" --arg parents "$parents" \
              --rawfile changes "$scratch/changes" --rawfile base_entry "$scratch/base-entry" \
              --rawfile head_entry "$scratch/head-entry" \
              --arg before_hex "$before_hex" --arg after_hex "$after_hex" \
              '{phase:$phase,repo:$repo,latest:$latest,channel:$channel,checkout:$checkout,dirty:$dirty,
                base:$base[0],pages:$pages[0],remote_status:$remote_status,remote_ref:$remote_ref,
                fetched:$fetched,parents:$parents,changes:$changes,base_entry:$base_entry,
                head_entry:$head_entry,before_hex:$before_hex,after_hex:$after_hex}' > "$scratch/input.json"
            python3 .github/scripts/toolchain-proposal.py < "$scratch/input.json" > "$scratch/decision.json"
          }
          action() { jq -er '.action' "$scratch/decision.json"; }
          acknowledge() {
            number=$(jq -er '.number' "$scratch/decision.json")
            echo "Validated open proposal #${number}"
          }

          observe observe
          initial=$(action)
          if [ "$initial" = open ]; then acknowledge; exit 0; fi
          if [ "$initial" = new ]; then
            cargo run --quiet --bin anvil -- toolchain --repo-dir . --to "${LATEST}" --apply
            # The CLI can decline a bump with status zero. Require its real edit.
            dirty=$(git status --porcelain)
            changed=$(git diff --name-status)
            summary=$(git diff --summary)
            [ "$dirty" = ' M rust-toolchain.toml' ]
            [ "$changed" = $'M\trust-toolchain.toml' ]
            [ -z "$summary" ]
            [ -f rust-toolchain.toml ] && [ ! -L rust-toolchain.toml ]
            git config user.name  "anvil"
            git config user.email "anvil@users.noreply.github.com"
            git checkout -b "${branch}"
            git commit -qam "chore(toolchain): move the channel from ${CHANNEL} to ${LATEST}"
            local_commit=$(git rev-parse HEAD)
            # Prove the actual disposable commit's bytes before any remote write.
            observe prepared
            [ "$(action)" = push ]
            expected_head=$local_commit
            git push -q origin "${branch}"
          elif [ "$initial" = recover ]; then
            expected_head=$(jq -er '.head_sha' "$scratch/decision.json")
          else
            echo "Unsupported initial proposal decision" >&2; exit 1
          fi

          # Re-read immediately before creation; other actors are not serialized
          # by this workflow's concurrency group. Changed evidence is a refusal.
          observe observe
          [ "$(jq -er '.head_sha' "$scratch/decision.json")" = "$expected_head" ]
          if [ "$(action)" = open ]; then acknowledge; exit 0; fi
          [ "$(action)" = recover ]
          if [ "$initial" = new ]; then
            account='This run completed the existing anvil toolchain probe/apply path and verified its exact channel edit.'
          else
            account='This run recovered an existing narrowly validated proposal; it did not run the toolchain probe and does not attest a prior probe.'
          fi
          gh pr create --repo "github.com/${GITHUB_REPOSITORY}" --base dev --head "${branch}" \
            --title "chore(toolchain): move the channel from ${CHANNEL} to ${LATEST}" \
            --body "Raised by \`toolchain-weekly\`. The pinned channel was ${CHANNEL}; latest stable is ${LATEST}.

          ${account}

          Only rust-toolchain.toml changes. The current producer does not update split CI workflow pins. Presubmit and ordinary review are still required; proposal creation is not proof that the bump is safe."
          observe observe
          [ "$(action)" = open ]
          [ "$(jq -er '.head_sha' "$scratch/decision.json")" = "$expected_head" ]
          acknowledge

  nightly:
    name: nightly-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    # Advisory. Nightly breaking is information about a future stable, not a
    # defect in this tree, and it must never gate a merge.
    #
    # Advisory is not the same as unread. A job whose failure reaches nobody is
    # not a canary, so the report step below routes the failure to an issue.
    continue-on-error: true
    # rustup resolves the toolchain from `rust-toolchain.toml` whenever cargo or
    # rustc runs inside the repository, and that file names the pin. Installing
    # nightly does not change it: this lane installed nightly and then built
    # with the pinned stable, printing "rustc 1.98.0" from a step titled "Which
    # nightly" while reporting success. RUSTUP_TOOLCHAIN outranks the file, and
    # is the only reason anything below is measured on nightly at all.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      # Several gates measure this repository's own history and refuse to
      # report a pass over a shallow clone, which is the right refusal and the
      # reason the suite needs the full history here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Resolve latest nightly
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: nightly
          components: clippy, rustfmt
      # The suite is not hermetic: `authority.rs` spawns `cargo metadata` under
      # an explicitly pinned RUSTUP_TOOLCHAIN so contributor toolchain files
      # cannot redirect it, and several gates shell out to rustfmt. Running the
      # suite on nightly therefore needs the pinned toolchain present too --
      # without it, `cargo metadata` fails, the audited macro surface is revoked
      # and 70 tests fail for a reason that has nothing to do with nightly.
      # Read from the file so this cannot drift from the pin the way the
      # hardcoded copy in authority.rs already has.
      - name: Install the pinned toolchain the suite spawns
        run: |
          set -eu
          pinned=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)
          [ -n "$pinned" ]
          echo "the suite spawns: ${pinned}"
          rustup toolchain install "$pinned" --profile minimal --component rustfmt
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      # The version this lane measured, recorded so a failure names it. Asserts
      # the override took: a canary that has silently fallen back to the pin is
      # the failure this lane exists to not have.
      #
      # It compares the ACTIVE TOOLCHAIN against the pin, not the version
      # string. Matching `*-nightly*` worked only while the pin was a release:
      # once the pin became `nightly-YYYY-MM-DD`, a fallback to it also prints
      # `1.100.0-nightly (...)` and passes the check written to catch it. The
      # guard would have been blind from the moment the pin moved.
      - name: Which nightly
        id: which
        run: |
          set -eu
          pinned=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)
          [ -n "$pinned" ]
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          version=$(rustc --version)
          echo "pinned:  ${pinned}"
          echo "active:  ${active}"
          echo "version: ${version}"
          case "$active" in
            "${pinned}"|"${pinned}-"*)
              echo "the canary fell back to the pin (${pinned}); RUSTUP_TOOLCHAIN did not take" >&2
              exit 1 ;;
          esac
          case "$active" in
            nightly-*) ;;
            *) echo "the canary is not on a nightly toolchain: ${active}" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore the complete locked source cache the macro surface needs
        run: cargo fetch --locked
      # `--no-run` proved these link, never that they pass. A test that compiles
      # on nightly and panics on nightly is the case this lane is for, and it
      # was indistinguishable from a clean run.
      - name: Suite on nightly
        id: suite
        run: cargo nextest run --all-targets --locked --no-fail-fast
      - name: Clippy on nightly
        id: clippy
        run: cargo clippy --all-targets -- -D warnings

      # The step that makes this a canary rather than a log line.
      #
      # One issue, reopened and updated rather than duplicated, so a nightly
      # that breaks for six weeks running is one thread and not six. The App
      # token is minted here and scoped to issues only: this lane never writes
      # code, and nothing below can push.
      - name: Mint repository-scoped App token
        id: app-token
        if: ${{ !cancelled() && (steps.which.outcome == 'failure' || steps.suite.outcome == 'failure' || steps.clippy.outcome == 'failure') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.ANVIL_APP_ID }}
          private-key: ${{ secrets.ANVIL_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Route the breakage to an owner
        if: ${{ !cancelled() && (steps.which.outcome == 'failure' || steps.suite.outcome == 'failure' || steps.clippy.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.which.outputs.version }}
          WHICH: ${{ steps.which.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          title="nightly-canary: the tree does not build on current nightly"
          # Which stage broke is the first thing a reader needs, and the only
          # part of this body that is not a fixed string or a run URL.
          # `[ x ] && y` under `set -e` aborts the script when the test is
          # false, which is every run where only one stage broke.
          failed=""
          if [ "$WHICH" = failure ]; then
            failed="${failed}- the canary could not confirm it was on nightly at all\n"
          fi
          if [ "$SUITE" = failure ]; then
            failed="${failed}- the suite failed\n"
          fi
          if [ "$CLIPPY" = failure ]; then
            failed="${failed}- clippy failed\n"
          fi
          body=$(printf 'Nightly: `%s`\n\nWhat broke:\n%s\nRun: %s\n\nThis lane is advisory and never gates a merge. It reports what a future stable will require, so the work is done before the pin moves rather than on the day it does.\n' \
            "${VERSION:-unknown}" "$failed" "$RUN_URL")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" \
            --json number,title,state --jq "[.[] | select(.title == \"$title\")] | first // empty")
          if [ -n "$existing" ]; then
            number=$(jq -er '.number' <<<"$existing")
            state=$(jq -er '.state' <<<"$existing")
            if [ "$state" = CLOSED ]; then
              gh issue reopen --repo "$GITHUB_REPOSITORY" "$number"
            fi
            gh issue comment --repo "$GITHUB_REPOSITORY" "$number" --body "$(printf '%b' "$body")"
            echo "Updated #${number}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf '%b' "$body")"
          fi
