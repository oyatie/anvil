[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
authors = ["Oyatie"]
description = "Anvil: Hyperscale Autonomous Engineering Delivery Fabric, Pre-Merge Quality Matrix & Merge Queue Daemon"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
async-trait = "0.1"
regex = "1.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
