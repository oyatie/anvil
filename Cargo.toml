[package]
name = "anvil"
version = "0.1.0"
edition = "2021"
authors = ["Oyatie"]
description = "Anvil: Hyperscale Autonomous Engineering Delivery Fabric, Pre-Merge Quality Matrix & Merge Queue Daemon"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
dotenvy = "0.15"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
async-trait = "0.1"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
socket2 = { version = "0.5", features = ["all"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"

[[test]]
name = "ai_driver_executor_port_test"
path = "tests/ai_driver_executor_port_test.rs"
