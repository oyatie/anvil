# The routing table. This file is the authority: `src/ai_driver/chain.rs` loads
# it with `include_str!` and refuses a table it cannot validate, so a stage named
# here and nowhere in the `Stage` enum -- or the reverse -- is a load error
# rather than a chain nothing dispatches.
#
# Tiers are ordered: the first is tried first, and a tier that fails hands the
# turn to the next. Chains are cross-provider by construction, so a stage that
# audits another does not audit it with the model that produced it.
#
# WHERE muse-spark-1.3 SITS, AND WHY IT IS LAST.
#
# It is the newest frontier entrant and it is fast, which argues for a high
# tier. It is placed last anyway, because the number that would justify a high
# tier cannot be checked: the 75.4% DeepSWE score does not appear on the public
# DeepSWE leaderboard -- only 1.2 is listed -- and its Artificial Analysis rank
# of 3rd puts it above GPT-6 and Gemini 3.8 Flash, both of which beat it in
# direct testing. It placed 20th on Beauty Bench.
#
# Those direct tests are one arcade-game build and an SVG benchmark, neither of
# which is this repository's workload, so they are weak evidence too. That is
# the point: there is no measurement of muse on the work anvil actually does,
# and an unverifiable leaderboard position is not one. Last tier gives the
# fleet a fifth independent provider and a real fallback without betting a
# primary on a number nobody can reproduce.
#
# Promote it when someone measures it here. "Numbers are measured, not quoted."

