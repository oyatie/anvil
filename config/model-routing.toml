provider = "claude"
effort = "high"
timeout_secs = 420  # 68 steps

[[stage.planning]]
model = "gpt-6-astra"
provider = "codex"
effort = "xhigh"
timeout_secs = 300  # 29 steps

[[stage.planning]]
model = "gemini-3.8-flash"
provider = "agy"
effort = "high"
timeout_secs = 600  # 166 steps

[[stage.planning]]
