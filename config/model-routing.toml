#
# WHAT EACH STAGE MAY WRITE.
#
# `writes` is the run scope: the path prefixes a turn at this stage may stage
# for commit. `ai_driver::chain` declares it into `.anvil/run-scope` before the
# turn and removes it after, and the `pre-commit` hook refuses anything outside
# it. Before this, that hook read a file nothing wrote, so the guardrail could
# not fire in a real checkout (#215).
#
# An empty list means the stage may commit NOTHING, and that is deliberate for
# every auditing stage: an auditor that writes is an auditor that edited what it
# was judging. `audits = ...` and `writes = []` are the same claim from two
# directions.
#
# Every stage declares one. A stage with no `writes` is a load error rather than
# an unrestricted stage, because an absent declaration is absent evidence, not
# permission.


[stage_meta.recon]
writes = []

[stage_meta.planning]
writes = ["docs/plan/"]

[stage_meta.plan_review]
audits = "planning"
writes = []

